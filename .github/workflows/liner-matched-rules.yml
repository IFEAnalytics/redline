name: Liner matched rule classification
on:
  push:
    branches: ['audit/liner-live-20261121']
    paths: ['.github/workflows/liner-matched-rules.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Give Liner the same rule rubric and manuscripts
        shell: python
        env:
          LINER_API_KEY: ${{ secrets.LINER_API_KEY }}
        run: |
          import json
          import os
          import sys
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          
          sys.path.insert(0, ".")
          from eval.run import score_case
          from redline.liner import Liner
          from redline.pipeline import RULES_SYS, _span, load_pack
          
          cases = [json.loads(p.read_text()) for p in sorted(Path("eval/cases").glob("*.json"))]
          assert len(cases) == 16
          pack = load_pack("research")
          valid = {r["id"] for r in pack["rules"]}
          rules = "\n".join(f"- {r['id']} {r['name']}: {r['check']}" for r in pack["rules"])
          system = RULES_SYS.format(rules=rules, max_findings=6)
          out = Path(os.environ["RUNNER_TEMP"]) / "matched-rules"
          out.mkdir()
          
          def run(case):
              client = Liner(model="liner-mark-1.3")
              text = case["text"].strip()
              raw = client.chat_json(system, f"이미 짚은 사실 오류:\n(없음)\n\n원고:\n\n{text}", max_tokens=4000, effort="medium")
              findings = [{**f, "span":_span(text, f.get("quote") or "")} for f in raw.get("findings", []) if isinstance(f, dict) and f.get("rule_id") in valid]
              rows = score_case(case, {"claims": [], "findings": findings})
              result = {"id": case["id"], "response": raw, "rows": rows, "usage": client.usage.as_dict()}
              (out / (case["id"] + ".json")).write_text(json.dumps(result, ensure_ascii=False, indent=2))
              return result
          
          with ThreadPoolExecutor(max_workers=3) as pool:
              data = list(pool.map(run, cases))
          rows = [r for case in data for r in case["rows"]]
          rules = [r for r in rows if r["kind"] == "rule"]
          controls = [r for r in rows if r["kind"] in ("control", "control_search")]
          summary = {"cases":len(data),"denom":len(rules),"caught":sum(r["caught"] for r in rules),"exact":sum(r["exact"] for r in rules),
                     "control_count":len(controls),"control_rule_marks":sum(bool(r["rules_hit"]) for r in controls),
                     "calls":sum(r["usage"]["model_calls"] for r in data),"models":sorted({m for r in data for m in r["usage"]["models"]}),
                     "rule_rows":rules}
          (out / "summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print("MATCHED_RESULT",json.dumps(summary,ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liner-matched-rules
          path: ${{ runner.temp }}/matched-rules
          retention-days: 14
