name: Redline submission verification and recording
on:
  push:
    branches: ['audit/liner-live-20261121']
    paths: ['.github/workflows/submission-narration.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2641723874a164ef91d8bb0df4b79c0c2fe68aae
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Record Korean narration
        env:
          LINER_API_KEY: ${{ secrets.LINER_API_KEY }}
        shell: python
        run: |

          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import os
          import requests
          import re
          import wave
          import time
          out = Path("evidence/voice")
          out.mkdir(parents=True, exist_ok=True)
          base = "https://platform.liner.com/api/v1"
          auth = {"x-api-key": os.environ["LINER_API_KEY"]}
          res = requests.get(base + "/models", headers=auth, timeout=40)
          res.raise_for_status()
          models = res.json()["data"]
          speech = [m for m in models if "tts" in m["id"].lower() and "gemini" in m["id"].lower()]
          if not speech:
              raise RuntimeError("Gemini speech model unavailable")
          speech.sort(key=lambda m: ("pro" not in m["id"], m["id"]))
          model = speech[0]["id"]
          voices = speech[0].get("supported_voices", [])
          voice = next((v for v in voices if isinstance(v,str) and v.lower()=="kore"), "Kore")
          print("Narration model", model, flush=True)
          lines = [line.split('|')[-2].strip() for line in Path("docs/video-script.md").read_text().splitlines() if line.startswith('| ')][1:]
          assert len(lines) == 6
          def narrate(pair):
              i,line = pair
              for attempt in range(3):
                  response = requests.post(base + "/audio/speech", headers=auth, json={"model":model,"voice":voice,"input":line},timeout=180)
                  if response.status_code not in (429,500,502,503,504): break
                  time.sleep(5 * (attempt + 1))
              if not response.ok:
                  raise RuntimeError(str(response.json().get("error",{}).get("message",""))[:300])
              ctype=response.headers.get("content-type","")
              data=response.content
              if "pcm" in ctype or ("wav" not in ctype and "mpeg" not in ctype and data[:4] != b"RIFF" and data[:3] != b"ID3"):
                  rate=re.search(r"rate=(\d+)",ctype)
                  with wave.open(str(out / f"{i}.wav"),"wb") as audio:
                      audio.setparams((1,2,int(rate.group(1)) if rate else 24000,0,"NONE",""))
                      audio.writeframes(data)
              else:
                  (out / f"{i}.audio").write_bytes(data)
              print(i,ctype,len(data),flush=True)
          with ThreadPoolExecutor(max_workers=2) as pool:
              list(pool.map(narrate, enumerate(lines,1)))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-voice
          path: evidence/
          retention-days: 14
