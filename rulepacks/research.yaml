# 리서치 원고 검토 규칙 — 1인 리서치 회사가 실제로 틀려 보고 만든 목록.
# 규칙 하나 = 선임이 초안에 빨간 줄을 긋는 이유 하나. 'origin'은 그 규칙이 생긴 실제 실수 유형이다.
id: research
name: 리서치·시장 분석 원고
audience: 거시·산업 리서치 브리프, 시장 해설 글, 투자자용 보고서
claim_scope: "통계 수치, 날짜가 있는 사건·결정, 인용, 용어의 정의 — 공개 자료로 확인할 수 있는 모든 사실 주장"
rules:
  - id: R01
    name: 출처 없는 수치
    check: 숫자가 들어간 단정에 출처(기관·자료명)나 기준 시점이 없는가.
    origin: 수치만 적고 출처를 달지 않아 나중에 어디서 온 숫자인지 되짚지 못했다.
  - id: R02
    name: 기준 시점 누락·혼동
    check: 수치가 어느 달·분기 값인지, 전월 대비인지 전년 대비인지 밝히지 않았거나 섞어 썼는가.
    origin: 전월 대비와 전년 대비를 한 문단에서 섞어 독자가 물가가 다시 뛴 것으로 읽었다.
  - id: R03
    name: 전부와 일부
    check: "'모든', '전부', '일제히' 같은 표현이 실제로는 일부에만 해당하는가."
    origin: 일부 업체의 가격 인상을 업계 전체의 인상으로 썼다.
  - id: R04
    name: 존재와 작동의 혼동
    check: 계약·발표·탑재(존재)를 이행·매출·가동(작동)처럼 썼는가.
    origin: 양해각서 체결을 수주로, 탑재를 기능 활성화로 적었다.
  - id: R05
    name: 비율로 총량을 말함
    check: 단가·비율·증가율만으로 총액·총량의 증감을 단정했는가.
    origin: 토큰당 단가가 내렸다는 사실로 총지출이 줄었다고 썼다(분모를 보지 않았다).
  - id: R06
    name: 전문용어 직역
    check: 통계·제도 용어를 발표 기관의 정의와 다르게 일반어로 옮겼는가.
    origin: PPI의 trade services를 '무역 서비스'로 옮겼다. 실제 뜻은 도소매 유통마진이다.
  - id: R07
    name: 상충하는 수치를 하나로 확정
    check: 출처마다 다른 수치·전망을 한쪽만 골라 사실처럼 썼는가.
    origin: 시장 규모 추정이 기관마다 두 배 차이 나는데 큰 쪽만 인용했다.
  - id: R08
    name: 반대 근거 없음
    check: 결론을 약하게 만드는 사실이나 반론이 원고에 한 줄도 없는가.
    origin: 논지에 맞는 자료만 모아 쓴 글이 발행 뒤 반박을 받았다.
  - id: R09
    name: 반증 조건 없는 전망
    check: 전망·판단에 '무엇이 나오면 틀린 것으로 본다'는 조건이 없는가.
    origin: 전망이 틀렸을 때 언제 접을지 정해 두지 않아 판단을 고치지 못했다.
  - id: R10
    name: 인과 단정
    check: 같이 움직였다는 사실만으로 원인이라고 단정했는가.
    origin: 금리 하락과 주가 상승이 같은 주에 있었다는 이유로 하나를 다른 하나의 원인으로 썼다.
  - id: R11
    name: 투자 권유로 읽히는 문장
    check: 매수·매도·비중 확대를 직접 권하거나 수익을 약속하는 문장이 있는가.
    origin: 정보 제공용 글에 '지금 사야 한다'는 문장이 들어가 규제상 문제가 될 뻔했다.
  - id: R12
    name: 오래된 자료의 현재형 서술
    check: 1년 넘은 수치·사건을 기준 시점 없이 지금 일처럼 썼는가.
    origin: 2년 전 조사 수치를 '현재'로 인용했다.
