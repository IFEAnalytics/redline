# 제안서·견적 검토 규칙 — 같은 엔진에 규칙 묶음만 갈아 끼우는 예시(컨설팅·영업 조직).
id: proposal
name: 제안서·사업계획서
audience: 컨설팅 제안서, 사업계획서, IR 자료
rules:
  - id: P01
    name: 범위와 제외 항목 불명확
    check: 무엇을 하고 무엇을 하지 않는지(제외 범위)가 적혀 있지 않은가.
    origin: 제외 범위를 적지 않아 계약 뒤 추가 작업을 무상으로 떠안았다.
  - id: P02
    name: 근거 없는 효과 수치
    check: 절감액·성장률·ROI에 산식이나 출처가 없는가.
    origin: '비용 30% 절감'의 산식을 묻는 질문에 답하지 못했다.
  - id: P03
    name: 일정과 인력의 불일치
    check: 일정·산출물·투입 인력이 서로 맞지 않는가(기간 합계, 인원 합계).
    origin: 본문은 12주인데 일정표는 14주였다.
  - id: P04
    name: 고객 과제와 무관한 자사 소개
    check: 고객이 제시한 과제에 답하지 않는 일반 회사 소개가 앞부분을 차지하는가.
    origin: 평가위원이 5쪽까지 넘겨도 자기 문제에 대한 답을 찾지 못했다.
  - id: P05
    name: 확인되지 않은 실적·고객명
    check: 실적·고객사·수상 이력이 확인 가능한 형태(연도·범위)로 적혀 있지 않은가.
    origin: 고객사 이름을 허락 없이 실었다가 삭제 요청을 받았다.
  - id: P06
    name: 시장 규모의 정의 누락
    check: 시장 규모 수치에 집계 정의·기준 연도·출처가 없는가.
    origin: 서로 다른 정의의 시장 규모를 더해 과대 추정했다.
